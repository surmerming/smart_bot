<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小答 · 知识库后台</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F5F6F8; color: #111214; }
      .top { background: #111214; color: #fff; padding: 18px 32px; display: flex; align-items: center; gap: 12px; }
      .logo { width: 34px; height: 34px; border-radius: 9px; background: #0066CC; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
      .top h1 { font-size: 17px; font-weight: 600; }
      .top .sub { font-size: 12px; color: #9CA3AF; margin-top: 2px; }
      .nav { margin-left: 32px; display: flex; gap: 6px; }
      .nav a { color: #D4D4D8; text-decoration: none; font-size: 13px; padding: 6px 14px; border-radius: 8px; }
      .nav a:hover { background: #27272A; }
      .nav a.active { background: #0066CC; color: #fff; }
      .top .actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
      .role { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #D4D4D8; }
      .role select { background: #27272A; border: 1px solid #3F3F46; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 12px; }
      .top button { background: #0066CC; border: none; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; }
      .top button.ghost { background: transparent; border: 1px solid #3F3F46; color: #D4D4D8; }
      .wrap { max-width: 1180px; margin: 24px auto; padding: 0 24px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
      .card { background: #fff; border: 1px solid #E7E8EA; border-radius: 12px; padding: 16px 18px; }
      .card .num { font-size: 26px; font-weight: 700; color: #0066CC; }
      .card .num.warn { color: #F59E0B; }
      .card .label { font-size: 12px; color: #6B7280; margin-top: 4px; }
      .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
      .tabs button { background: #fff; border: 1px solid #E7E8EA; color: #6B7280; padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; }
      .tabs button.active { background: #0066CC; border-color: #0066CC; color: #fff; }
      .panel { background: #fff; border: 1px solid #E7E8EA; border-radius: 12px; padding: 20px 22px; margin-bottom: 18px; }
      .panel-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
      .panel h2 { font-size: 15px; font-weight: 600; }
      .panel-head .spacer { flex: 1; }
      .toolbar { display: flex; gap: 10px; align-items: center; }
      .toolbar input, .toolbar select { border: 1px solid #E7E8EA; border-radius: 8px; padding: 7px 12px; font-size: 13px; background: #fff; }
      .toolbar input { width: 220px; }
      .btn { border: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
      .btn.primary { background: #0066CC; color: #fff; }
      .btn.success { background: #22C55E; color: #fff; }
      .btn.danger { background: #EF4444; color: #fff; }
      .btn.warn { background: #F59E0B; color: #fff; }
      .btn.ghost { background: #F0F1F3; color: #374151; }
      .btn.small { padding: 4px 10px; font-size: 12px; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; color: #6B7280; font-weight: 500; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid #E7E8EA; white-space: nowrap; }
      td { padding: 10px; border-bottom: 1px solid #F3F4F6; vertical-align: middle; line-height: 1.55; }
      td .q { font-weight: 600; }
      td .a { color: #6B7280; font-size: 12px; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
      .badge.green { background: #DCFCE7; color: #15803D; }
      .badge.orange { background: #FEF3C7; color: #B45309; }
      .badge.red { background: #FEE2E2; color: #B91C1C; }
      .badge.gray { background: #F3F4F6; color: #6B7280; }
      .badge.blue { background: #DBEAFE; color: #1D4ED8; }
      .empty { text-align: center; color: #9CA3AF; padding: 32px 0; font-size: 13px; }
      .error { color: #EF4444; font-size: 13px; padding: 10px; }
      .tip { font-size: 12px; color: #9CA3AF; margin-top: 10px; line-height: 1.6; }
      .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start; justify-content: center; padding: 48px 24px; z-index: 100; overflow-y: auto; }
      .modal-mask.show { display: flex; }
      .modal { background: #fff; border-radius: 14px; width: 640px; max-width: 100%; padding: 24px 26px; }
      .modal h3 { font-size: 16px; margin-bottom: 18px; }
      .form-row { margin-bottom: 14px; }
      .form-row label { display: block; font-size: 12px; color: #6B7280; margin-bottom: 6px; }
      .form-row input, .form-row select, .form-row textarea { width: 100%; border: 1px solid #E7E8EA; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: inherit; }
      .form-row textarea { resize: vertical; min-height: 64px; }
      .form-row .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
      .versions-snapshot { font-size: 12px; color: #6B7280; background: #F9FAFB; border-radius: 6px; padding: 8px 10px; margin-top: 6px; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow-y: auto; display: none; }
      .versions-snapshot.show { display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/kb.tsx"></script>
  </body>
</html>
