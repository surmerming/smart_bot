<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小答 · 坐席工作台</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F5F6F8; color: #111214; }
      .top { background: #111214; color: #fff; padding: 18px 32px; display: flex; align-items: center; gap: 12px; }
      .logo { width: 34px; height: 34px; border-radius: 9px; background: #0066CC; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
      .top h1 { font-size: 17px; font-weight: 600; }
      .top .sub { font-size: 12px; color: #9CA3AF; margin-top: 2px; }
      .top .actions { margin-left: auto; display: flex; gap: 10px; }
      .top button { background: #0066CC; border: none; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; }
      .top button.ghost { background: transparent; border: 1px solid #3F3F46; color: #D4D4D8; }
      .wrap { max-width: 1080px; margin: 24px auto; padding: 0 24px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
      .stat { background: #fff; border: 1px solid #E7E8EA; border-radius: 12px; padding: 16px 18px; }
      .stat .num { font-size: 26px; font-weight: 700; color: #0066CC; }
      .stat .label { font-size: 12px; color: #6B7280; margin-top: 4px; }
      .card { background: #fff; border: 1px solid #E7E8EA; border-radius: 12px; margin-bottom: 12px; padding: 16px 18px; display: flex; gap: 16px; align-items: flex-start; }
      .card .badge { flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px; background: #FFF7ED; border: 1px solid #FED7AA; color: #9A3412; display: flex; align-items: center; justify-content: center; font-weight: 700; }
      .card .body { flex: 1; min-width: 0; }
      .card .summary { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
      .card .meta { font-size: 12px; color: #6B7280; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 12px; }
      .card .meta b { color: #111214; font-weight: 600; }
      .card button.done { flex-shrink: 0; background: #0066CC; color: #fff; border: none; padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; }
      .card button.done:hover { background: #0052A3; }
      .empty { text-align: center; color: #9CA3AF; padding: 48px 0; font-size: 14px; }
      .error { color: #EF4444; font-size: 13px; padding: 10px; }
      .done-list { margin-top: 8px; }
      .done-card { opacity: .55; }
      .done-card .badge { background: #F0FDF4; border-color: #BBF7D0; color: #16A34A; }
      .sec-title { font-size: 13px; font-weight: 600; color: #6B7280; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
      .sec-title .cnt { background: #E8F1FC; color: #0066CC; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
      .ws-state { margin-left: auto; font-size: 12px; padding: 5px 12px; border-radius: 999px; border: 1px solid #3F3F46; color: #D4D4D8; }
      .ws-state.on { border-color: #22C55E; color: #4ADE80; }
      .ws-state.off { border-color: #F59E0B; color: #FBBF24; }
      /* V2.0 AI Copilot */
      .copilot { margin-top: 12px; border-top: 1px dashed #E7E8EA; padding-top: 10px; }
      .copilot-title { font-size: 12px; font-weight: 700; color: #0066CC; margin-bottom: 8px; }
      .ticket { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 12px; background: #F8FAFC; border: 1px solid #EEF0F2; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
      .ticket .k { color: #6B7280; }
      .ticket .v { color: #111214; word-break: break-all; }
      .copilot-btns { display: flex; flex-wrap: wrap; gap: 8px; }
      .copilot-btns button { font-size: 12px; padding: 6px 12px; border-radius: 7px; border: 1px solid #CBD5E1; background: #fff; color: #0F172A; cursor: pointer; }
      .copilot-btns button.primary { background: #0066CC; border-color: #0066CC; color: #fff; }
      .copilot-btns button:hover { opacity: .85; }
      .templates { margin-top: 10px; display: grid; gap: 8px; }
      .template { position: relative; background: #F0F7FF; border: 1px solid #D6E9FF; border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.6; }
      .template button { position: absolute; right: 8px; top: 8px; font-size: 11px; padding: 3px 8px; border: none; background: #0066CC; color: #fff; border-radius: 6px; cursor: pointer; }
      .query-result { margin-top: 10px; font-size: 12px; background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 8px; padding: 10px 12px; line-height: 1.6; }
      .query-result .mock-tag { display: inline-block; background: #F59E0B; color: #fff; font-size: 10px; border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
      .copilot-loading { font-size: 12px; color: #9CA3AF; }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="logo">答</div>
      <div>
        <h1>小答 · 坐席工作台</h1>
        <div class="sub">转人工待办 / AI Copilot（工单卡片 + 快捷回复 + 内部系统查询）</div>
      </div>
      <div class="ws-state" id="ws-state">连接中…</div>
      <div class="actions">
        <button id="refresh" class="ghost">刷新</button>
      </div>
    </div>
    <div class="wrap">
      <div class="stats">
        <div class="stat"><div class="num" id="st-waiting">–</div><div class="label">等待处理</div></div>
        <div class="stat"><div class="num" id="st-done">–</div><div class="label">已完成</div></div>
        <div class="stat"><div class="num" id="st-total">–</div><div class="label">累计转入</div></div>
      </div>
      <div class="sec-title">待办列表 <span class="cnt" id="waiting-cnt">0</span></div>
      <div id="waiting-list"></div>
      <div class="sec-title">已完成 <span class="cnt" id="done-cnt">0</span></div>
      <div id="done-list" class="done-list"></div>
      <div id="error"></div>
    </div>
    <script type="module" src="/src/agent.ts"></script>
  </body>
</html>
