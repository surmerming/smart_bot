# 生产期依赖：Qdrant（向量库）+ Redis（限流/缓存）
# MVP 阶段无容器依赖（简化向量 + 内存限流），生产期取消下面注释即可一键拉起。
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  qdrant_data:
