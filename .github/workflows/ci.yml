name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + eval + load smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: API tests (Mock LLM, offline)
        run: |
          cd backend
          python -m pytest tests/test_api.py tests/test_badcase_report.py tests/test_v2_ws_copilot.py tests/test_kb_admin.py tests/test_v2_ops.py tests/test_v2_gaps.py -q

      - name: Retrieval evaluation (golden dataset)
        run: |
          cd backend
          python tests/eval.py

      - name: Load test smoke (in-process Mock)
        run: |
          cd backend
          python tests/load_test.py --concurrency 4 --total 5

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Typecheck + build (index / agent / dashboard)
        run: cd frontend && pnpm run build
